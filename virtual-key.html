<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Tesla 虛擬金鑰配對</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:20vh auto;padding:0 1.2rem;line-height:1.7}h1{font-size:1.5rem}a{color:#0645ad}</style></head><body><h1>Tesla 虛擬金鑰配對</h1><p>在已登入你 Tesla 帳號的手機點選下方官方連結，選擇你的車輛，依 Tesla App 指示確認加入虛擬金鑰。這會授權應用程式發出車輛指令。</p><p><a href="https://tesla.com/_ak/p2pzvp96fg-netizen.github.io">打開 Tesla App 配對</a></p><p>你可以隨時在車輛的「鎖」畫面移除這把鑰匙。這個頁面本身不收集或傳送資料。</p></body></html>
